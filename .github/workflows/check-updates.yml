name: Check for upstream updates

# Runs daily at 07:00 UTC.
# When a new version is found, updates the spec file and pushes a commit.
# The commit triggers the build-xdna-driver / build-fastflowlm workflows.
#
# Required secret: AUTO_UPDATE_TOKEN
#   A GitHub Personal Access Token with 'contents: write' scope.
#   Needed because pushes via GITHUB_TOKEN do not trigger other workflows.
#   Create one at https://github.com/settings/tokens and add it under
#   Settings > Secrets and variables > Actions.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_UPDATE_TOKEN }}

      # --- xdna-driver ---

      - name: Check xdna-driver latest release branch
        id: xdna
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # amd/xdna-driver ships via numbered release BRANCHES (1.7, 1.8, ...),
          # not tags (it has a single, stale git tag). The amdxdna 0.15 driver
          # source lives under drivers/accel/. Pick the highest numeric branch
          # that contains that tree.
          BRANCH=$(gh api repos/amd/xdna-driver/branches --paginate --jq '.[].name' \
            | grep -E '^[0-9]+\.[0-9]+$' | sort -V | tac \
            | while read -r b; do \
                if gh api "repos/amd/xdna-driver/contents/drivers/accel?ref=$b" >/dev/null 2>&1; then \
                  echo "$b"; break; \
                fi; \
              done)
          COMMIT=$(gh api "repos/amd/xdna-driver/commits/$BRANCH" --jq '.sha')
          # The package version tracks the bundled XRT version (XRT_VERSION_MINOR
          # in the XRT submodule at that branch's commit) -> 2.<minor>.0.
          XRT_SHA=$(gh api "repos/amd/xdna-driver/contents/xrt?ref=$BRANCH" --jq '.sha')
          XRT_MIN=$(gh api "repos/Xilinx/XRT/contents/src/CMake/settings.cmake?ref=$XRT_SHA" \
            --jq '.content' | base64 -d \
            | awk '/set\(XRT_VERSION_MINOR/{gsub(/[^0-9]/,"",$2); print $2; exit}')
          LATEST="2.${XRT_MIN}.0"
          CURRENT=$(awk '/^Version:/{print $2}' xdna-driver/xdna-driver.spec)
          CUR_COMMIT=$(awk '/^%global amd_commit/{print $3}' xdna-driver/xdna-driver.spec)
          echo "latest=$LATEST"   >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH"   >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT"   >> "$GITHUB_OUTPUT"
          echo "xdna-driver: current=$CURRENT@$CUR_COMMIT latest=$LATEST@$COMMIT (branch $BRANCH)"
          if [ "$LATEST" != "$CURRENT" ] || [ "$COMMIT" != "$CUR_COMMIT" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "::notice::xdna-driver update available: $CURRENT -> $LATEST (branch $BRANCH, commit $COMMIT)"
          fi

      - name: Update xdna-driver spec
        if: steps.xdna.outputs.updated == 'true'
        env:
          NEW_VER: ${{ steps.xdna.outputs.latest }}
          NEW_BRANCH: ${{ steps.xdna.outputs.branch }}
          NEW_COMMIT: ${{ steps.xdna.outputs.commit }}
        run: |
          sed -i "s|^%global amd_branch.*|%global amd_branch ${NEW_BRANCH}|" xdna-driver/xdna-driver.spec
          sed -i "s|^%global amd_commit.*|%global amd_commit ${NEW_COMMIT}|" xdna-driver/xdna-driver.spec
          make bump-xdna VER="${NEW_VER}"

      # --- fastflowlm ---

      - name: Check fastflowlm latest release
        id: flm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api repos/FastFlowLM/FastFlowLM/releases/latest \
            --jq '.tag_name' | sed 's/^v//')
          CURRENT=$(awk '/^Version:/{print $2}' fastflowlm/fastflowlm.spec)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "fastflowlm: current=$CURRENT latest=$LATEST"
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "::notice::fastflowlm update available: $CURRENT -> $LATEST"
          fi

      - name: Update fastflowlm spec
        if: steps.flm.outputs.updated == 'true'
        env:
          NEW_VER: ${{ steps.flm.outputs.latest }}
        run: make bump-flm VER="${NEW_VER}"

      # --- commit ---

      - name: Commit and push
        if: steps.xdna.outputs.updated == 'true' || steps.flm.outputs.updated == 'true'
        env:
          XDNA_UPDATED: ${{ steps.xdna.outputs.updated }}
          XDNA_VER: ${{ steps.xdna.outputs.latest }}
          FLM_UPDATED: ${{ steps.flm.outputs.updated }}
          FLM_VER: ${{ steps.flm.outputs.latest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          MSG="chore: bump"
          [ "$XDNA_UPDATED" = "true" ] && MSG="$MSG xdna-driver to ${XDNA_VER}"
          [ "$XDNA_UPDATED" = "true" ] && [ "$FLM_UPDATED" = "true" ] && MSG="$MSG,"
          [ "$FLM_UPDATED"  = "true" ] && MSG="$MSG fastflowlm to ${FLM_VER}"

          git add xdna-driver/xdna-driver.spec fastflowlm/fastflowlm.spec
          git commit -m "$MSG"
          git push

